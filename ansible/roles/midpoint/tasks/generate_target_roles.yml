---
- name: Generate MidPoint roles for {{ target_definition.id }}
  ansible.builtin.template:
    src: generated-target-role.xml.j2
    dest: >-
      {{ project_dir }}/midpoint/generated-roles/role-{{
        target_definition.id }}-{{ target_role.key }}.xml
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  loop: "{{ gateway_midpoint_role_defaults[target_definition.type] }}"
  loop_control:
    loop_var: target_role
    label: "{{ target_definition.id }} / {{ target_role.key }}"
  register: generated_target_role_templates

- name: Add {{ target_definition.id }} roles to generated manifest
  ansible.builtin.set_fact:
    gateway_generated_role_files: >-
      {{
        gateway_generated_role_files
        + (generated_target_role_templates.results | map(attribute='dest') | list)
      }}
