# =============================================================================
# Gateway IAM — Ansible variables
# Override at runtime: ansible-playbook site.yml -e "smtp_user=you@gmail.com"
# =============================================================================

# --- Project ------------------------------------------------------------------
project_dir: /opt/gitivity
project_repo_src: "{{ playbook_dir | dirname }}"   # local path of the repo

# Stateful rollout controls. Redis target identifiers are canonical lowercase
# IDs from config/targets.yaml. The migration is safe to run on every deploy:
# RENAMENX preserves the legacy key when a canonical key already exists.
gateway_redis_target_key_migration_enabled: true
gateway_redis_state_patterns:
  - "user_state:*"
# Release contract for the incident of 2026-07-28. This deliberately blocks a
# rollout from a stale controller checkout that would overwrite the VPS hotfix.
gateway_required_application_markers:
  - path: app/core/orchestrator.py
    marker: "Duplicate pending UPDATE detected"

# MidPoint roles are generated exclusively from native entitlements discovered
# for every enabled target. No static or fictional role defaults are allowed.
gateway_legacy_midpoint_roles:
  - {target_id: ldap, replacement_key: admins, role_oid: "a1b2c3d4-3333-0000-0000-000000000212", role_name: "Gateway - Groupe LDAP Admin"}
  - {target_id: ldap, replacement_key: developers, role_oid: "a1b2c3d4-3333-0000-0000-000300000002", role_name: "Gateway - Groupe LDAP Dev"}
  - {target_id: mongodb, replacement_key: dbadmin, role_oid: "a1b2c3d4-4444-0000-0000-000000000885", role_name: "Gateway - MongoDB DbAdmin (shadowRef)"}
  - {target_id: mongodb, replacement_key: readwrite, role_oid: "a1b2c3d4-4444-0000-0000-000000000884", role_name: "Gateway - MongoDB ReadWrite (shadowRef)"}
  - {target_id: mysql, replacement_key: admin, role_oid: "a1b2c3d4-1111-0000-0000-000000000402", role_name: "Gateway - MySQL Admin"}
  - {target_id: mysql, replacement_key: readonly, role_oid: "a1b2c3d4-1111-0000-0000-000000000002", role_name: "Gateway - MySQL readonly"}
  - {target_id: postgresql, replacement_key: admin, role_oid: "a1b2c3d4-2222-0000-0000-000000000092", role_name: "Gateway - PostgreSQL Amin"}
  - {target_id: postgresql, replacement_key: readonly, role_oid: "a1b2c3d4-2222-0000-0000-000000000882", role_name: "Gateway - PostgreSQL ReadOnly (shadowRef)"}
  - {target_id: ldap, replacement_key: base, role_oid: "00000000-0000-0000-0000-000000000103", role_name: "ldap4"}
  - {target_id: mongodb, replacement_key: base, role_oid: "00000000-0000-0000-0000-000000000104", role_name: "mongodb"}
  - {target_id: mysql, replacement_key: base, role_oid: "00000000-0000-0000-0000-000000000101", role_name: "mysql"}
  - {target_id: odoo, replacement_key: base, role_oid: "00000000-0000-0000-0000-000000004201", role_name: "Gateway - odoo"}
  - {target_id: postgresql, replacement_key: base, role_oid: "00000000-0000-0000-0000-000000000102", role_name: "postgresql"}

# --- Server IP (used in approval email links and service URLs) ----------------
# Service ports are bound only on this address, not on every host interface.
service_bind_ip: "10.10.0.1"
server_ip: "{{ service_bind_ip }}"
# Port publié par le PostgreSQL cible. Modifiable si une instance existante
# utilise déjà 5433 sur service_bind_ip.
postgresql_target_host_port: 5433
# Port publié par la nouvelle cible MongoDB. Le port interne reste 27017.
mongodb_target_host_port: 27017
# Port publié par la cible LDAP locale. Le port interne reste 10389.
ldap_target_host_port: 10389

# --- Profiles -----------------------------------------------------------------
with_targets: false     # set true to also start LDAP/MySQL/PostgreSQL/MongoDB/Odoo
with_midpoint: true     # set false to skip MidPoint setup

# --- SMTP (approval + confirmation emails) ------------------------------------
# Gmail app password recommended. Leave empty + approval_mode=auto for testing.
smtp_user: ""
smtp_password: ""
approval_mode: email   # email | auto

# --- MidPoint -----------------------------------------------------------------
midpoint_admin_user: administrator
midpoint_admin_password: Test5ecr3t

# External MidPoint mode: configure an EXISTING MidPoint instance instead of
# starting one in docker-compose. The REST steps (resource + roles import,
# connector OID discovery) work against any reachable <ip>:<port>.
#   ansible-playbook site.yml -e midpoint_external=true \
#     -e midpoint_host=10.0.0.5 -e midpoint_port=8080 \
#     -e midpoint_admin_password=<password>
midpoint_external: false
midpoint_host: "{{ service_bind_ip }}"     # external mode: IP/hostname of the existing MidPoint
midpoint_port: 8080
# service_bind_ip when local: REST/health tasks run ON the target host, through
# the same interface where Docker publishes MidPoint.
midpoint_url: "http://{{ midpoint_host }}:{{ midpoint_port }}/midpoint"

# Docker container holding MidPoint. With an external instance running in
# Docker ON THE SAME HOST, override midpoint_container and force
# midpoint_manage_container=true to keep automatic JAR deploy + restart.
# With a remote/non-Docker instance the JAR deploy is skipped: install
# build/libs/{{ jar_name }} into <midpoint-home>/var/icf-connectors/ manually.
midpoint_container: gitivity-midpoint
midpoint_manage_container: "{{ not (midpoint_external | bool) }}"

# URL used by the gateway containers (MidPoint role rollback on rejection)
midpoint_gateway_url: "{{ midpoint_url if (midpoint_external | bool) else 'http://gitivity-midpoint:8080/midpoint' }}"

# Bundle name comes from the gradle project name (settings.gradle)
connector_bundle: GateWay-IAM
# Former bundle name still present in ressource.xml's connectorConfiguration namespace
old_connector_bundle_ns: GateWay-IAM
connector_version: 1.2.0-SNAPSHOT
# settings.gradle rootProject.name = 'GateWay-IAM' determines the JAR file name
jar_name: GateWay-IAM-1.2.0-SNAPSHOT.jar
old_connector_oid: 84505b3d-5f90-4617-a160-6548be000a44
resource_oid: 736ea741-2c73-4478-b5d1-07d84cdf860f
old_resource_oid_in_roles: 3447776b-105c-4663-a025-5b27568ee091

# --- Timeouts -----------------------------------------------------------------
service_wait_timeout: 300
service_wait_delay: 10
midpoint_connector_wait_timeout: 120
gateway_consumer_wait_timeout: 120

# Runtime targets are intended for tests. On the next Ansible deployment,
# start their approval-based cleanup unless they were exported to targets.yaml.
decommission_unexported_runtime_targets_on_deploy: true
