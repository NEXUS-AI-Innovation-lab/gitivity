version: 1

# Catalogue déclaratif des cibles de provisioning.
#
# Ajouter une nouvelle INSTANCE d'un type supporté consiste à dupliquer une
# entrée, changer son id/aliases et ses paramètres de connexion. Les valeurs
# ${VAR:-default} sont résolues depuis l'environnement au chargement.
targets:
  - id: mysql
    type: mysql
    display_name: MySQL
    enabled: true
    aliases: [mysql, sql, mariadb, mysql1, mysql2, mysql3, mysql4]
    connection:
      host: ${MYSQL_HOST:-localhost}
      port: ${MYSQL_PORT:-3306}
      user: ${MYSQL_USER:-root}
      password: ${MYSQL_PASSWORD:-}
      database: ${MYSQL_DATABASE:-mysql}
      connect_timeout: ${MYSQL_CONNECT_TIMEOUT:-10}
    routing:
      entitlement_attributes: [mysqlProfile, mysqlGrants, mysqlRole]
    entitlements:
      provider: mysql_roles
      identifier: "{target}.{name}"
      association_ref: mysqlProfile
      base_name: gateway-base
    provisioning:
      managed_roles:
        - name: admin
          privileges: [ALL]
        - name: readonly
          privileges: [SELECT]
    deployment:
      environment:
        MYSQL_HOST: mysql-target
        MYSQL_PORT: 3306
        MYSQL_USER: root
        MYSQL_PASSWORD: mysql_root_secret
        MYSQL_DATABASE: target_db
        MYSQL_CONNECT_TIMEOUT: 10

  - id: postgresql
    type: postgresql
    display_name: PostgreSQL
    enabled: true
    aliases: [postgresql, postgres, pg, postgresql1, postgresql2, postgresql3, postgresql4, postgres1, postgres2, postgres3, postgres4]
    connection:
      host: ${POSTGRESQL_HOST:-localhost}
      port: ${POSTGRESQL_PORT:-5432}
      user: ${POSTGRESQL_USER:-postgres}
      password: ${POSTGRESQL_PASSWORD:-}
      database: ${POSTGRESQL_DATABASE:-postgres}
      connect_timeout: ${POSTGRESQL_CONNECT_TIMEOUT:-10}
    routing:
      entitlement_attributes: [postgresqlProfile, postgresqlGrants, postgresqlRole]
    entitlements:
      provider: postgresql_roles
      identifier: "{target}.{name}"
      association_ref: postgresqlProfile
      base_name: gateway-base
    provisioning:
      managed_roles:
        - name: admin
          privileges: [ALL]
        - name: readonly
          privileges: [SELECT]
    deployment:
      environment:
        POSTGRESQL_HOST: postgresql-target
        POSTGRESQL_PORT: 5432
        POSTGRESQL_USER: target_user
        POSTGRESQL_PASSWORD: target_secret
        POSTGRESQL_DATABASE: target_db
        POSTGRESQL_CONNECT_TIMEOUT: 10

  - id: mongodb
    type: mongodb
    display_name: MongoDB
    enabled: true
    aliases: [mongodb, mongo]
    connection:
      host: ${MONGODB_HOST:-localhost}
      port: ${MONGODB_PORT:-27017}
      user: ${MONGODB_USER:-root}
      password: ${MONGODB_PASSWORD:-}
      database: ${MONGODB_DATABASE:-target_db}
      auth_source: ${MONGODB_AUTH_SOURCE:-admin}
      connect_timeout: ${MONGODB_CONNECT_TIMEOUT:-10}
    routing:
      entitlement_attributes: [mongodbRoles, mongodbRole]
    entitlements:
      provider: mongodb_roles
      identifier: "{target}.{role}@{database}"
      association_ref: mongodbRole
      base_name: gateway-base
    deployment:
      environment:
        MONGODB_HOST: mongodb-target
        MONGODB_PORT: 27017
        MONGODB_USER: root
        MONGODB_PASSWORD: mongodb_root_secret
        MONGODB_DATABASE: target_db
        MONGODB_AUTH_SOURCE: admin
        MONGODB_CONNECT_TIMEOUT: 10

  - id: ldap
    type: ldap
    display_name: LDAP
    enabled: true
    aliases: [ldap, ldap1, ldap2, ldap3, ldap4, activedirectory, ad]
    connection:
      host: ${LDAP_HOST:-localhost}
      port: ${LDAP_PORT:-10389}
      use_ssl: ${LDAP_USE_SSL:-false}
      bind_dn: ${LDAP_BIND_DN:-uid=admin,ou=system}
      bind_password: ${LDAP_BIND_PASSWORD:-secret}
      base_dn: ${LDAP_BASE_DN:-dc=openmicroscopy,dc=org}
      users_base_dn: ${LDAP_USERS_BASE_DN:-ou=Users,dc=openmicroscopy,dc=org}
      groups_base_dn: ${LDAP_GROUPS_BASE_DN:-ou=Groups,dc=openmicroscopy,dc=org}
      group_object_classes: [groupOfNames, groupOfUniqueNames]
      user_object_class: ${LDAP_USER_OBJECT_CLASS:-inetOrgPerson}
      connect_timeout: ${LDAP_CONNECT_TIMEOUT:-10}
    routing:
      entitlement_attributes: [ldapGroups, ldapGroup]
      delete_mode: delete
    provisioning:
      group_object_class: groupOfNames
      group_member_attribute: member
      group_initial_member: ${LDAP_BIND_DN:-uid=admin,ou=system}
    entitlements:
      provider: ldap_groups
      identifier: "{target}.{name}"
      association_ref: ldapGroup
      base_name: gateway-base
    deployment:
      environment:
        LDAP_HOST: ldap
        LDAP_PORT: 10389
        LDAP_USE_SSL: false
        LDAP_BIND_DN: uid=admin,ou=system
        LDAP_BIND_PASSWORD: secret
        LDAP_BASE_DN: dc=openmicroscopy,dc=org
        LDAP_USERS_BASE_DN: ou=Users,dc=openmicroscopy,dc=org
        LDAP_GROUPS_BASE_DN: ou=Groups,dc=openmicroscopy,dc=org
        LDAP_USER_OBJECT_CLASS: inetOrgPerson
        LDAP_CONNECT_TIMEOUT: 10
  - id: odoo
    type: odoo
    display_name: Odoo
    enabled: true
    aliases: [odoo, odoo1, odoo2, odoo3, odoo4, erp]
    connection:
      url: ${ODOO_URL:-http://localhost:8069}
      database: ${ODOO_DB:-odoo}
      username: ${ODOO_USERNAME:-admin}
      password: ${ODOO_PASSWORD:-admin}
      timeout: ${ODOO_TIMEOUT:-30}
    routing:
      entitlement_attributes: [odooGroups, odooGroup]
    entitlements:
      provider: odoo_groups
      identifier: "{target}.{name}"
      association_ref: odooGroup
      base_name: gateway-base
    deployment:
      environment:
        ODOO_URL: http://odoo:8069
        ODOO_DB: odoo
        ODOO_USERNAME: admin
        ODOO_PASSWORD: admin
        ODOO_TIMEOUT: 30

  - id: ldap-test
    type: ldap
    display_name: LDAP_TEST
    enabled: true
    aliases: [ldap-test]
    connection:
      host: ${LDAP_TEST_HOST:-localhost}
      port: ${LDAP_TEST_PORT:-10389}
      use_ssl: ${LDAP_TEST_USE_SSL:-false}
      bind_dn: ${LDAP_TEST_BIND_DN:-uid=admin,ou=system}
      bind_password: ${LDAP_TEST_BIND_PASSWORD:-secret}
      base_dn: ${LDAP_TEST_BASE_DN:-dc=openmicroscopy,dc=org}
      users_base_dn: ${LDAP_TEST_USERS_BASE_DN:-ou=users,ou=olga,dc=lissi,dc=fr}
      groups_base_dn: ${LDAP_TEST_GROUPS_BASE_DN:-ou=groups,ou=olga,dc=lissi,dc=fr}
      group_object_classes: [groupOfNames]
      user_object_class: ${LDAP_TEST_USER_OBJECT_CLASS:-inetOrgPerson}
      connect_timeout: ${LDAP_TEST_CONNECT_TIMEOUT:-10}
    routing:
      entitlement_attributes: [ldapGroups, ldapGroup]
      delete_mode: delete
    provisioning:
      group_object_class: groupOfNames
      group_member_attribute: member
      group_initial_member: ${LDAP_TEST_BIND_DN:-cn=admin,dc=lissi,dc=fr}
    entitlements:
      provider: ldap_groups
      identifier: "{target}.{name}"
      association_ref: ldapGroup
      base_name: gateway-base
    deployment:
      environment:
        LDAP_TEST_HOST: 10.10.0.1
        LDAP_TEST_PORT: 389
        LDAP_TEST_USE_SSL: false
        LDAP_TEST_BIND_DN: cn=admin,dc=lissi,dc=fr
        LDAP_TEST_BIND_PASSWORD: labadmin
        LDAP_TEST_BASE_DN: dc=lissi,dc=fr
        LDAP_TEST_USERS_BASE_DN: ou=users,ou=olga,dc=lissi,dc=fr
        LDAP_TEST_GROUPS_BASE_DN: ou=groups,ou=olga,dc=lissi,dc=fr
        LDAP_TEST_USER_OBJECT_CLASS: inetOrgPerson
        LDAP_TEST_CONNECT_TIMEOUT: 10

  - id: postgresql-demo
    type: postgresql
    display_name: PostgreSQL Demo
    enabled: true
    aliases: [postgresql-demo, pg-demo]
    connection:
      host: ${POSTGRESQL_DEMO_HOST:-10.10.0.1}
      port: ${POSTGRESQL_DEMO_PORT:-5436}
      user: ${POSTGRESQL_DEMO_USER:-demo_provisioner}
      password: ${POSTGRESQL_DEMO_PASSWORD:-DemoProvisioner5ecr3t!}
      database: ${POSTGRESQL_DEMO_DATABASE:-demo_db}
      connect_timeout: ${POSTGRESQL_DEMO_CONNECT_TIMEOUT:-10}
    routing:
      entitlement_attributes: [postgresqlProfile, postgresqlGrants, postgresqlRole]
      delete_mode: delete
    entitlements:
      provider: postgresql_roles
      identifier: "{target}.{name}"
      association_ref: postgresqlProfile
      base_name: gateway-base
    provisioning:
      managed_roles:
        - name: demo_readonly
          privileges: [SELECT]
    deployment:
      environment:
        POSTGRESQL_DEMO_HOST: 10.10.0.1
        POSTGRESQL_DEMO_PORT: 5436
        POSTGRESQL_DEMO_USER: demo_provisioner
        POSTGRESQL_DEMO_PASSWORD: "DemoProvisioner5ecr3t!"
        POSTGRESQL_DEMO_DATABASE: demo_db
        POSTGRESQL_DEMO_CONNECT_TIMEOUT: 10
