name: Docker Build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t gitivity-api .

      - name: Build Gateway HTTP image
        run: docker build -f docker/Dockerfile.gateway-http -t gitivity-http .