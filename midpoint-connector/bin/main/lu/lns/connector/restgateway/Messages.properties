connector.restgateway.display=REST Gateway Connector
connector.restgateway.help=Connector that forwards identity operations to a REST gateway as JSON

gatewayUrl.display=Gateway URL
gatewayUrl.help=REST API endpoint URL (e.g., http://localhost:5000)

connectionTimeout.display=Connection Timeout (ms)
connectionTimeout.help=Timeout for establishing connection in milliseconds (default: 30000)

requestTimeout.display=Request Timeout (ms)
requestTimeout.help=Timeout for completing request in milliseconds (default: 60000)

validateSsl.display=Validate SSL
validateSsl.help=Whether to validate SSL certificates for HTTPS connections (default: true)

useRabbitmq.display=Use RabbitMQ
useRabbitmq.help=Enable RabbitMQ mode instead of HTTP Gateway (default: false)

rabbitmqHost.display=RabbitMQ Host
rabbitmqHost.help=RabbitMQ server hostname or IP (default: localhost)

rabbitmqPort.display=RabbitMQ Port
rabbitmqPort.help=RabbitMQ server port (default: 5672)

rabbitmqUsername.display=RabbitMQ Username
rabbitmqUsername.help=Username for RabbitMQ authentication (default: admin)

rabbitmqPassword.display=RabbitMQ Password
rabbitmqPassword.help=Password for RabbitMQ authentication

rabbitmqQueue.display=RabbitMQ Queue
rabbitmqQueue.help=Queue name for publishing messages (default: midpoint-operations)
